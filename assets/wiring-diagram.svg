<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1600 500" width="1600" height="500" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Diagrama de fiacao entre duas protoboards, ESP32-S3, microfone INMP441, amplificador MAX98357A e display OLED SSD1306">
  <style>
    :root{
      --paper:#EDEEEA; --panel:#E2E4DC; --hole:#AAAEA2;
      --ink:#1B2320; --ink-muted:#5B635C; --line:#C7CBC0;
      --chip-esp:#20241F; --chip-esp-ink:#EDEEEA;
      --chip-pcb:#33513F; --chip-pcb-ink:#EAF0EA;
      --c-3v3:#C6303E; --c-5v:#D9822E; --c-gnd:#181C1A;
      --c-sck:#2F6FED; --c-ws:#1F9E6D; --c-sd:#8B5CF6;
      --c-bclk:#B9871A; --c-lrc:#158F8F; --c-din:#C93D80;
      --c-sda:#9C5A26; --c-scl:#54579E; --c-misc:#7A7F78;
    }
    @media (prefers-color-scheme: dark){
      :root{
        --paper:#181B18; --panel:#232722; --hole:#4A5048;
        --ink:#EDEFE9; --ink-muted:#9AA096; --line:#3A4038;
        --chip-esp:#2A2F2A; --chip-esp-ink:#F1F2ED;
        --chip-pcb:#3C5A48; --chip-pcb-ink:#EAF0EA;
        --c-3v3:#E4515E; --c-5v:#F0A24C; --c-gnd:#E7EAE3;
        --c-sck:#6C97F5; --c-ws:#48C793; --c-sd:#B08CFB;
        --c-bclk:#DCB33F; --c-lrc:#3FC5C5; --c-din:#E4699E;
        --c-sda:#C98A52; --c-scl:#8A8DD6; --c-misc:#9CA199;
      }
    }
    text{ font-family:'Consolas','SF Mono','Roboto Mono',ui-monospace,monospace; }
    .title{ font-family:'Segoe UI',Arial,sans-serif; font-weight:700; }
  </style>

  <rect x="0" y="0" width="1600" height="500" fill="var(--paper)"/>
  <text x="800" y="26" text-anchor="middle" class="title" font-size="16" fill="var(--ink)">Sage — Diagrama de fiação (2× protoboard 830)</text>

  <!-- ================= BOARD BODIES ================= -->
  <rect x="30" y="60" width="710" height="400" rx="10" fill="var(--panel)" stroke="var(--line)" stroke-width="2"/>
  <rect x="860" y="60" width="710" height="400" rx="10" fill="var(--panel)" stroke="var(--line)" stroke-width="2"/>

  <text x="385" y="50" text-anchor="middle" font-size="12.5" letter-spacing="1.5" fill="var(--ink-muted)">PLACA A — ESP32-S3</text>
  <text x="1215" y="50" text-anchor="middle" font-size="12.5" letter-spacing="1.5" fill="var(--ink-muted)">PLACA B — PERIFÉRICOS I2S / I2C</text>

  <!-- terminal fields -->
  <defs>
    <pattern id="holes" width="15" height="15" patternUnits="userSpaceOnUse">
      <circle cx="7.5" cy="7.5" r="1.4" fill="var(--hole)"/>
    </pattern>
  </defs>
  <rect x="45" y="125" width="680" height="270" fill="url(#holes)"/>
  <rect x="875" y="125" width="680" height="270" fill="url(#holes)"/>
  <line x1="45" y1="260" x2="725" y2="260" stroke="var(--line)" stroke-width="2" stroke-dasharray="2 5"/>
  <line x1="875" y1="260" x2="1555" y2="260" stroke="var(--line)" stroke-width="2" stroke-dasharray="2 5"/>

  <!-- rails: top 3V3/GND, bottom 5V/GND, both boards -->
  <g font-size="11" fill="var(--ink-muted)">
    <line x1="45" y1="82" x2="725" y2="82" stroke="var(--c-3v3)" stroke-width="3"/>
    <text x="45" y="77">+3V3</text>
    <line x1="45" y1="102" x2="725" y2="102" stroke="var(--c-gnd)" stroke-width="3"/>
    <text x="45" y="117">GND</text>
    <line x1="45" y1="418" x2="725" y2="418" stroke="var(--c-5v)" stroke-width="3"/>
    <text x="45" y="413">+5V</text>
    <line x1="45" y1="438" x2="725" y2="438" stroke="var(--c-gnd)" stroke-width="3"/>
    <text x="45" y="453">GND</text>

    <line x1="875" y1="82" x2="1555" y2="82" stroke="var(--c-3v3)" stroke-width="3"/>
    <text x="875" y="77">+3V3</text>
    <line x1="875" y1="102" x2="1555" y2="102" stroke="var(--c-gnd)" stroke-width="3"/>
    <text x="875" y="117">GND</text>
    <line x1="875" y1="418" x2="1555" y2="418" stroke="var(--c-5v)" stroke-width="3"/>
    <text x="875" y="413">+5V</text>
    <line x1="875" y1="438" x2="1555" y2="438" stroke="var(--c-gnd)" stroke-width="3"/>
    <text x="875" y="453">GND</text>
  </g>

  <!-- ================= BRIDGE WIRES ================= -->
  <g fill="none" stroke-width="4.5" stroke-linecap="round">
    <path d="M725,82 C775,74 825,90 875,82" stroke="var(--c-3v3)"/>
    <path d="M725,102 C775,94 825,110 875,102" stroke="var(--c-gnd)"/>
    <path d="M725,418 C775,426 825,410 875,418" stroke="var(--c-5v)"/>
    <path d="M725,438 C775,446 825,430 875,438" stroke="var(--c-gnd)"/>
  </g>
  <text x="792" y="60" font-size="10.5" fill="var(--ink-muted)" letter-spacing="0.5">PONTES</text>

  <!-- ================= ESP32-S3 CHIP ================= -->
  <rect x="170" y="190" width="430" height="140" rx="6" fill="var(--chip-esp)" stroke="var(--line)" stroke-width="1.5"/>
  <text x="385" y="230" text-anchor="middle" class="title" font-size="16" fill="var(--chip-esp-ink)">ESP32-S3</text>
  <text x="385" y="248" text-anchor="middle" font-size="10.5" fill="var(--chip-esp-ink)" opacity="0.75">DevKitC-1 N16R8</text>
  <text x="385" y="300" text-anchor="middle" font-size="9.5" fill="var(--chip-esp-ink)" opacity="0.55">BOOT = GPIO0 (embutido, sem fio)</text>

  <g stroke-width="3" stroke-linecap="round">
    <line x1="230" y1="82"  x2="230" y2="190" stroke="var(--c-3v3)"/>
    <line x1="430" y1="102" x2="430" y2="190" stroke="var(--c-gnd)"/>
  </g>
  <g font-size="11" font-weight="600">
    <text x="234" y="180" transform="rotate(-55 234 180)" fill="var(--c-3v3)">3V3</text>
    <text x="434" y="180" transform="rotate(-55 434 180)" fill="var(--c-gnd)">GND</text>
  </g>

  <g stroke-width="3" stroke-linecap="round">
    <line x1="195" y1="330" x2="195" y2="418" stroke="var(--c-5v)"/>
    <line x1="234" y1="330" x2="234" y2="438" stroke="var(--c-gnd)"/>
  </g>
  <g font-size="11" font-weight="600">
    <text x="199" y="340" transform="rotate(55 199 340)" fill="var(--c-5v)">5V</text>
    <text x="238" y="340" transform="rotate(55 238 340)" fill="var(--c-gnd)">GND</text>
    <text x="277" y="340" transform="rotate(55 277 340)" fill="var(--c-sck)">GPIO42</text>
    <text x="316" y="340" transform="rotate(55 316 340)" fill="var(--c-ws)">GPIO41</text>
    <text x="355" y="340" transform="rotate(55 355 340)" fill="var(--c-sd)">GPIO2</text>
    <text x="394" y="340" transform="rotate(55 394 340)" fill="var(--c-bclk)">GPIO15</text>
    <text x="433" y="340" transform="rotate(55 433 340)" fill="var(--c-lrc)">GPIO16</text>
    <text x="472" y="340" transform="rotate(55 472 340)" fill="var(--c-din)">GPIO7</text>
    <text x="511" y="340" transform="rotate(55 511 340)" fill="var(--c-sda)">GPIO8</text>
    <text x="550" y="340" transform="rotate(55 550 340)" fill="var(--c-scl)">GPIO9</text>
  </g>
  <g stroke-width="3" stroke-linecap="round">
    <line x1="273" y1="330" x2="273" y2="342" stroke="var(--c-sck)"/>
    <line x1="312" y1="330" x2="312" y2="342" stroke="var(--c-ws)"/>
    <line x1="351" y1="330" x2="351" y2="342" stroke="var(--c-sd)"/>
    <line x1="390" y1="330" x2="390" y2="342" stroke="var(--c-bclk)"/>
    <line x1="429" y1="330" x2="429" y2="342" stroke="var(--c-lrc)"/>
    <line x1="468" y1="330" x2="468" y2="342" stroke="var(--c-din)"/>
    <line x1="507" y1="330" x2="507" y2="342" stroke="var(--c-sda)"/>
    <line x1="546" y1="330" x2="546" y2="342" stroke="var(--c-scl)"/>
  </g>

  <!-- ================= BOARD B MODULES ================= -->
  <!-- MIC INMP441 -->
  <rect x="895" y="170" width="165" height="140" rx="5" fill="var(--chip-pcb)" stroke="var(--line)" stroke-width="1.5"/>
  <text x="977" y="195" text-anchor="middle" class="title" font-size="13" fill="var(--chip-pcb-ink)">INMP441</text>
  <text x="977" y="210" text-anchor="middle" font-size="9.5" fill="var(--chip-pcb-ink)" opacity="0.75">mic I2S</text>
  <g stroke-width="3" stroke-linecap="round">
    <line x1="930" y1="82"  x2="930" y2="170" stroke="var(--c-3v3)"/>
    <line x1="1030" y1="102" x2="1030" y2="170" stroke="var(--c-gnd)"/>
    <line x1="920" y1="310" x2="920" y2="438" stroke="var(--c-gnd)"/>
    <line x1="965" y1="310" x2="965" y2="322" stroke="var(--c-sck)"/>
    <line x1="1005" y1="310" x2="1005" y2="322" stroke="var(--c-ws)"/>
    <line x1="1045" y1="310" x2="1045" y2="322" stroke="var(--c-sd)"/>
  </g>
  <g font-size="10.5" font-weight="600">
    <text x="934" y="160" transform="rotate(-55 934 160)" fill="var(--c-3v3)">VDD</text>
    <text x="1034" y="160" transform="rotate(-55 1034 160)" fill="var(--c-gnd)">GND</text>
    <text x="924" y="322" transform="rotate(55 924 322)" fill="var(--c-gnd)">L/R</text>
    <text x="969" y="322" transform="rotate(55 969 322)" fill="var(--c-sck)">SCK</text>
    <text x="1009" y="322" transform="rotate(55 1009 322)" fill="var(--c-ws)">WS</text>
    <text x="1049" y="322" transform="rotate(55 1049 322)" fill="var(--c-sd)">SD</text>
  </g>

  <!-- AMP MAX98357A -->
  <rect x="1120" y="170" width="200" height="140" rx="5" fill="var(--chip-pcb)" stroke="var(--line)" stroke-width="1.5"/>
  <text x="1220" y="195" text-anchor="middle" class="title" font-size="13" fill="var(--chip-pcb-ink)">MAX98357A</text>
  <text x="1220" y="210" text-anchor="middle" font-size="9.5" fill="var(--chip-pcb-ink)" opacity="0.75">amp I2S</text>
  <g stroke-width="3" stroke-linecap="round">
    <line x1="1150" y1="82" x2="1150" y2="170" stroke="var(--c-3v3)"/>
    <line x1="1150" y1="310" x2="1150" y2="418" stroke="var(--c-5v)"/>
    <line x1="1190" y1="310" x2="1190" y2="438" stroke="var(--c-gnd)"/>
    <line x1="1230" y1="310" x2="1230" y2="322" stroke="var(--c-bclk)"/>
    <line x1="1270" y1="310" x2="1270" y2="322" stroke="var(--c-lrc)"/>
    <line x1="1305" y1="310" x2="1305" y2="322" stroke="var(--c-din)"/>
  </g>
  <g font-size="10.5" font-weight="600">
    <text x="1154" y="160" transform="rotate(-55 1154 160)" fill="var(--c-3v3)">SD-EN</text>
    <text x="1154" y="322" transform="rotate(55 1154 322)" fill="var(--c-5v)">VIN</text>
    <text x="1194" y="322" transform="rotate(55 1194 322)" fill="var(--c-gnd)">GND</text>
    <text x="1234" y="322" transform="rotate(55 1234 322)" fill="var(--c-bclk)">BCLK</text>
    <text x="1274" y="322" transform="rotate(55 1274 322)" fill="var(--c-lrc)">LRC</text>
    <text x="1309" y="322" transform="rotate(55 1309 322)" fill="var(--c-din)">DIN</text>
  </g>
  <g stroke="var(--c-misc)" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M1320,205 C1345,205 1345,205 1368,218"/>
    <path d="M1320,275 C1345,275 1345,275 1368,258"/>
  </g>
  <g transform="translate(1372,220)">
    <rect x="0" y="0" width="20" height="30" fill="var(--chip-esp)" stroke="var(--line)"/>
    <path d="M20,4 L38,-8 L38,42 L20,26 Z" fill="var(--chip-esp)" stroke="var(--line)" stroke-linejoin="round"/>
    <path d="M42,4 A16,16 0 0 1 42,30" fill="none" stroke="var(--ink-muted)" stroke-width="1.6"/>
    <path d="M48,-4 A24,24 0 0 1 48,38" fill="none" stroke="var(--ink-muted)" stroke-width="1.6" opacity="0.6"/>
  </g>
  <text x="1370" y="282" font-size="9.5" fill="var(--ink-muted)">alto-falante</text>

  <!-- OLED SSD1306 -->
  <rect x="1400" y="170" width="150" height="140" rx="5" fill="var(--chip-pcb)" stroke="var(--line)" stroke-width="1.5"/>
  <text x="1475" y="195" text-anchor="middle" class="title" font-size="13" fill="var(--chip-pcb-ink)">SSD1306</text>
  <text x="1475" y="210" text-anchor="middle" font-size="9.5" fill="var(--chip-pcb-ink)" opacity="0.75">OLED 128×64 I2C</text>
  <g stroke-width="3" stroke-linecap="round">
    <line x1="1430" y1="82" x2="1430" y2="170" stroke="var(--c-3v3)"/>
    <line x1="1520" y1="102" x2="1520" y2="170" stroke="var(--c-gnd)"/>
    <line x1="1450" y1="310" x2="1450" y2="322" stroke="var(--c-sda)"/>
    <line x1="1490" y1="310" x2="1490" y2="322" stroke="var(--c-scl)"/>
  </g>
  <g font-size="10.5" font-weight="600">
    <text x="1434" y="160" transform="rotate(-55 1434 160)" fill="var(--c-3v3)">VCC</text>
    <text x="1524" y="160" transform="rotate(-55 1524 160)" fill="var(--c-gnd)">GND</text>
    <text x="1454" y="322" transform="rotate(55 1454 322)" fill="var(--c-sda)">SDA</text>
    <text x="1494" y="322" transform="rotate(55 1494 322)" fill="var(--c-scl)">SCL</text>
  </g>

  <!-- ================= LONG SIGNAL WIRES ================= -->
  <g fill="none" stroke-width="4" stroke-linecap="round" opacity="0.92">
    <path d="M273,342 C 320,392 900,402 965,322" stroke="var(--c-sck)"/>
    <path d="M312,342 C 355,398 940,412 1005,322" stroke="var(--c-ws)"/>
    <path d="M351,342 C 390,404 980,422 1045,322" stroke="var(--c-sd)"/>
    <path d="M390,342 C 470,408 1160,422 1230,322" stroke="var(--c-bclk)"/>
    <path d="M429,342 C 520,414 1200,428 1270,322" stroke="var(--c-lrc)"/>
    <path d="M468,342 C 580,420 1240,434 1305,322" stroke="var(--c-din)"/>
    <path d="M507,342 C 700,426 1380,440 1450,322" stroke="var(--c-sda)"/>
    <path d="M546,342 C 740,432 1420,446 1490,322" stroke="var(--c-scl)"/>
  </g>

  <!-- pin dots -->
  <g fill="var(--ink)">
    <circle cx="230" cy="190" r="3.2"/><circle cx="430" cy="190" r="3.2"/>
    <circle cx="195" cy="330" r="3.2"/><circle cx="234" cy="330" r="3.2"/>
    <circle cx="273" cy="330" r="3.2"/><circle cx="312" cy="330" r="3.2"/><circle cx="351" cy="330" r="3.2"/>
    <circle cx="390" cy="330" r="3.2"/><circle cx="429" cy="330" r="3.2"/><circle cx="468" cy="330" r="3.2"/>
    <circle cx="507" cy="330" r="3.2"/><circle cx="546" cy="330" r="3.2"/>
    <circle cx="930" cy="170" r="3.2"/><circle cx="1030" cy="170" r="3.2"/><circle cx="920" cy="310" r="3.2"/>
    <circle cx="965" cy="310" r="3.2"/><circle cx="1005" cy="310" r="3.2"/><circle cx="1045" cy="310" r="3.2"/>
    <circle cx="1150" cy="170" r="3.2"/><circle cx="1150" cy="310" r="3.2"/><circle cx="1190" cy="310" r="3.2"/>
    <circle cx="1230" cy="310" r="3.2"/><circle cx="1270" cy="310" r="3.2"/><circle cx="1305" cy="310" r="3.2"/>
    <circle cx="1430" cy="170" r="3.2"/><circle cx="1520" cy="170" r="3.2"/>
    <circle cx="1450" cy="310" r="3.2"/><circle cx="1490" cy="310" r="3.2"/>
  </g>

  <text x="800" y="488" text-anchor="middle" font-size="10.5" fill="var(--ink-muted)">
    GND comum obrigatório · MAX98357A em 5V (VIN) · L/R do INMP441 no GND · SD do amp em nível alto (3V3)
  </text>
</svg>

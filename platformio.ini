; =============================================================================
;  Sage - Assistente de Voz Nativo e Autonomo
;  ESP32-S3 DevKitC-1 N16R8 (16MB Flash QIO + 8MB PSRAM OPI)
; =============================================================================

[env:esp32-s3-devkitc-1]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; ---------------------------------------------------------------------------
;  Serial / Upload
; ---------------------------------------------------------------------------
monitor_speed   = 115200
upload_speed    = 921600
monitor_filters = esp32_exception_decoder, time

; ---------------------------------------------------------------------------
;  Memoria do modulo N16R8
;  qio_opi = Flash em QIO (16MB) + PSRAM em modo OPI (Octal, 8MB)
;  Sem "memory_type = qio_opi" a PSRAM OPI NAO e detectada e ps_malloc() falha.
; ---------------------------------------------------------------------------
board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_build.partitions          = default_16MB.csv
board_upload.flash_size         = 16MB
board_upload.maximum_size       = 16777216

; ---------------------------------------------------------------------------
;  Flags de compilacao
;  ARDUINO_USB_CDC_ON_BOOT=0  -> Serial sai pela porta "UART" do DevKit.
;    Se voce usa o cabo na porta "USB" (OTG/nativa), troque para 1.
;  CORE_DEBUG_LEVEL: 0=none 1=error 2=warn 3=info 4=debug 5=verbose
; ---------------------------------------------------------------------------
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=2
    -DCONFIG_SPIRAM_USE_MALLOC=1
    -std=gnu++17

build_unflags =
    -std=gnu++11

; ---------------------------------------------------------------------------
;  Bibliotecas
;  Adafruit SH110X so e necessaria se o seu OLED for SH1106
;  (veja OLED_DRIVER em include/config.h)
; ---------------------------------------------------------------------------
lib_deps =
    bblanchon/ArduinoJson@^7.4.2
    adafruit/Adafruit GFX Library@^1.12.1
    adafruit/Adafruit SSD1306@^2.5.15
    adafruit/Adafruit BusIO@^1.17.2
    adafruit/Adafruit SH110X@^2.1.13

lib_ldf_mode = deep+
